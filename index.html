<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#b91c1c">
    <title>POS Táctil Visual - EL WEY PICA POLLO</title>
    <style>
        :root {
            --bg: #cbd5e1;
            --card: #f8fafc;
            --primary: #b91c1c;
            --primary-dark: #991b1b;
            --accent: #f59e0b;
            --success: #15803d;
            --info: #1d4ed8;
            --text: #0f172a;
            --muted: #475569;
            --border: #cbd5e1;
            --border-strong: #94a3b8;
            --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.12);
            --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.16);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background-color: #cbd5e1;
            color: var(--text);
            overflow-x: hidden;
        }

        button {
            cursor: pointer;
            transition: transform 0.08s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        #screen-pos {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
        }

        .topbar {
            background: #18181b;
            color: #ffffff;
            padding: 8px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid var(--accent);
        }

        .nav-tabs {
            display: flex;
            gap: 6px;
        }

        .nav-btn {
            height: 36px;
            padding: 0 12px;
            border-radius: 8px;
            border: 1.5px solid #3f3f46;
            background: #27272a;
            color: #f4f4f5;
            font-size: 0.8rem;
            font-weight: 800;
        }

        .nav-btn.active {
            background: var(--primary);
            border-color: #fde047;
            color: #ffffff;
        }

        .view-section {
            display: none;
            width: 100%;
            flex: 1;
        }

        .view-section.active {
            display: block;
        }

        .page-wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 14px;
        }

        .page-head {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-btn {
            height: 38px;
            padding: 0 14px;
            border-radius: 8px;
            border: 1.5px solid var(--border-strong);
            background: #f8fafc;
            color: #1e293b;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .tab-btn.active {
            background: #18181b;
            border-color: #18181b;
            color: #fde047;
        }

        .pos-layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 380px;
            gap: 12px;
            padding: 12px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .menu-panel {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .prod-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .prod-card {
            background: #ffffff;
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 8px;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .prod-img-wrap {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            overflow: hidden;
            background: #f1f5f9;
            margin-bottom: 6px;
            border: 1px solid #cbd5e1;
        }

        .prod-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .prod-name {
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text);
            margin-bottom: 4px;
        }

        .prod-price {
            font-size: 0.82rem;
            font-weight: 900;
            color: var(--primary);
        }

        .cart-panel {
            background: var(--card);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            display: flex;
            flex-direction: column;
        }

        .cart-items {
            min-height: 140px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .cart-item {
            background: #f8fafc;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 6px 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }

        .ci-thumb {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            object-fit: cover;
            border: 1px solid var(--border-strong);
        }

        .modal-overlay {
            display: none !important;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.75);
            z-index: 950;
            align-items: center;
            justify-content: center;
            padding: 14px;
        }

        .modal-overlay.open {
            display: flex !important;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
        }

        .modal-head {
            background: #18181b;
            color: #ffffff;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-body {
            padding: 18px;
            max-height: 75vh;
            overflow-y: auto;
        }

        .modal-foot {
            padding: 12px 18px;
            background: #f8fafc;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
        }

        /* ESTILOS DE LA GALERÍA INTERNA */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .gallery-thumb-item {
            position: relative;
            aspect-ratio: 1/1;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border);
            cursor: pointer;
            background: #f1f5f9;
        }

        .gallery-thumb-item:hover {
            border-color: var(--primary);
            transform: scale(1.03);
        }

        .gallery-thumb-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #toast-msg {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #18181b;
            color: #fde047;
            border: 1.5px solid var(--accent);
            padding: 10px 18px;
            border-radius: 999px;
            font-size: 0.84rem;
            font-weight: 900;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.2s ease;
        }

        #toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

<section id="screen-pos">
    <header class="topbar">
        <div style="font-size:1rem;font-weight:900;color:#fde047;">🍗 EL WEY PICA POLLO - POS</div>
        <nav class="nav-tabs">
            <button type="button" class="nav-btn active" data-action="nav" data-view="ventas">🛒 Ventas</button>
            <button type="button" class="nav-btn" data-action="nav" data-view="productos">📦 Productos & Galería</button>
        </nav>
    </header>

    <!-- VISTA VENTAS -->
    <div id="view-ventas" class="view-section active">
        <div class="pos-layout">
            <div class="menu-panel">
                <div id="prod-grid" class="prod-grid"></div>
            </div>
            <aside class="cart-panel">
                <h3 style="font-size:0.9rem;font-weight:900;margin-bottom:8px;">🧾 Ticket Actual</h3>
                <div id="cart-items" class="cart-items"></div>
                <div style="border-top:2px solid #e2e8f0;padding-top:8px;display:flex;justify-content:space-between;font-weight:900;font-size:1.1rem;margin-bottom:10px;">
                    <span>TOTAL:</span><span id="sum-total" style="color:var(--success);">RD$ 0.00</span>
                </div>
                <button type="button" class="tab-btn" style="background:var(--success);color:#fff;width:100%;height:44px;" data-action="clear-cart">🗑️ Limpiar Carrito</button>
            </aside>
        </div>
    </div>

    <!-- VISTA PRODUCTOS Y GESTOR DE GALERÍA -->
    <div id="view-productos" class="view-section">
        <div class="page-wrap">
            <div class="page-head">
                <h2>📦 Catálogo de Productos y Galería de Imágenes</h2>
                <button type="button" class="tab-btn" style="background:#18181b;color:#fde047;" data-action="open-gallery-modal">🖼️ Abrir Galería de Imágenes</button>
            </div>
            <div class="card-table">
                <table style="width:100%;border-collapse:collapse;font-size:0.85rem;">
                    <thead>
                        <tr style="background:#18181b;color:#fde047;">
                            <th style="padding:10px;text-align:left;">IMG</th>
                            <th style="padding:10px;text-align:left;">PRODUCTO</th>
                            <th style="padding:10px;text-align:left;">PRECIO</th>
                            <th style="padding:10px;text-align:center;">ACCIÓN</th>
                        </tr>
                    </thead>
                    <tbody id="prods-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>
</section>

<!-- MODAL SELECCIONAR / SUBIR IMAGEN DESDE LA GALERÍA -->
<div id="modal-image-gallery" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-head">
            <h3>🖼️ Galería de Imágenes del Negocio</h3>
            <button type="button" class="modal-close" data-action="close-modal" data-modal="modal-image-gallery" style="background:#27272a;color:#fff;border:none;width:30px;height:30px;border-radius:6px;">✕</button>
        </div>
        <div class="modal-body">
            <div style="margin-bottom:12px;background:#f8fafc;padding:12px;border-radius:10px;border:1.5px dashed var(--border-strong);text-align:center;">
                <label class="tab-btn" style="background:var(--primary);color:#fff;cursor:pointer;display:inline-block;height:42px;line-height:42px;padding:0 18px;">
                    📁 Subir Nueva Foto a la Galería
                    <input type="file" id="inp-upload-gallery-file" accept="image/*" style="display:none;">
                </label>
                <div style="font-size:0.75rem;color:var(--muted);margin-top:4px;">Se optimizará automáticamente para el POS</div>
            </div>
            <div style="font-size:0.82rem;font-weight:900;color:var(--text);margin-bottom:6px;">Selecciona una imagen para el producto:</div>
            <div id="gallery-thumbs-container" class="gallery-grid"></div>
        </div>
        <div class="modal-foot">
            <button type="button" class="tab-btn" data-action="close-modal" data-modal="modal-image-gallery">Cerrar</button>
        </div>
    </div>
</div>

<div id="toast-msg"></div>

<script>
(function() {
    'use strict';

    // Galería interna guardada en localStorage
    var savedGallery = JSON.parse(localStorage.getItem('ew_image_gallery') || 'null');
    if (!savedGallery) {
        savedGallery = [
            'https://zuazo352.github.io/el_wey_pica_pollo/Fotos/IMG_4388_recortado.jpg',
            'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=300&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=300&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?w=300&auto=format&fit=crop&q=80',
            'https://images.unsplash.com/photo-1598103442097-8b74394b95c6?w=300&auto=format&fit=crop&q=80'
        ];
    }

    var products = JSON.parse(localStorage.getItem('ew_products_gallery_v1') || 'null');
    if (!products) {
        products = [
            { id: 201, name: 'Extra $25', category: 'Extras', price: 25, image: savedGallery[0] },
            { id: 202, name: 'Extra Papas', category: 'Extras', price: 75, image: savedGallery[1] },
            { id: 203, name: 'Arroz Pescado', category: 'Platos del Día', price: 180, image: savedGallery[2] },
            { id: 204, name: 'Plato día 2 Pza Pollo Frito', category: 'Platos del Día', price: 200, image: savedGallery[3] },
            { id: 205, name: 'Plato día 1 Pza Pollo Frito', category: 'Platos del Día', price: 140, image: savedGallery[3] },
            { id: 206, name: '1 Pollo Horneado', category: 'Pollo Horneado', price: 550, image: savedGallery[4] },
            { id: 207, name: '3/4 Pollo Horneado', category: 'Pollo Horneado', price: 420, image: savedGallery[4] },
            { id: 208, name: '1/2 Pollo Horneado', category: 'Pollo Horneado', price: 280, image: savedGallery[4] },
            { id: 209, name: '1/4 Pollo Horneado', category: 'Pollo Horneado', price: 150, image: savedGallery[4] }
        ];
    }

    var cart = [];
    var editingProductId = null;

    function toast(msg) {
        var el = document.getElementById('toast-msg');
        if (!el) return;
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(function() { el.classList.remove('show'); }, 2500);
    }

    function escHtml(str) {
        return String(str == null ? '' : str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function fmtMoney(n) {
        return 'RD$ ' + Number(n || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function switchView(v) {
        document.querySelectorAll('.view-section').forEach(function(el) { el.classList.remove('active'); });
        document.querySelectorAll('.nav-btn').forEach(function(el) { el.classList.remove('active'); });
        document.getElementById('view-' + v).classList.add('active');
        document.querySelector('[data-view="' + v + '"]').classList.add('active');
        if (v === 'productos') renderProductsTable();
    }

    function renderCatalog() {
        var grid = document.getElementById('prod-grid');
        grid.innerHTML = products.map(function(p) {
            return '<button type="button" class="prod-card" data-action="add-prod" data-id="' + p.id + '">' +
                '<div class="prod-img-wrap"><img src="' + escHtml(p.image) + '" alt=""></div>' +
                '<div>' +
                    '<div class="prod-name">' + escHtml(p.name) + '</div>' +
                    '<div class="prod-price">' + fmtMoney(p.price) + '</div>' +
                '</div>' +
            '</button>';
        }).join('');
    }

    function renderProductsTable() {
        var tb = document.getElementById('prods-table-body');
        tb.innerHTML = products.map(function(p) {
            return '<tr style="border-bottom:1px solid #cbd5e1;">' +
                '<td style="padding:10px;"><img src="' + escHtml(p.image) + '" style="width:40px;height:40px;border-radius:6px;object-fit:cover;border:1px solid #cbd5e1;" alt=""></td>' +
                '<td style="padding:10px;font-weight:900;">' + escHtml(p.name) + '</td>' +
                '<td style="padding:10px;font-weight:900;color:var(--success);">' + fmtMoney(p.price) + '</td>' +
                '<td style="padding:10px;text-align:center;"><button type="button" class="tab-btn" data-action="select-img-for-prod" data-id="' + p.id + '">🖼️ Cambiar Foto</button></td>' +
            '</tr>';
        }).join('');
    }

    function renderGalleryModalThumbs() {
        var container = document.getElementById('gallery-thumbs-container');
        container.innerHTML = savedGallery.map(function(url, idx) {
            return '<div class="gallery-thumb-item" data-action="pick-gallery-img" data-url="' + escHtml(url) + '">' +
                '<img src="' + escHtml(url) + '" alt="">' +
            '</div>';
        }).join('');
    }

    function renderCart() {
        var box = document.getElementById('cart-items');
        if (!cart.length) {
            box.innerHTML = '<div style="text-align:center;padding:20px;color:#94a3b8;font-weight:800;">Carrito vacío</div>';
            document.getElementById('sum-total').textContent = 'RD$ 0.00';
            return;
        }
        var total = 0;
        box.innerHTML = cart.map(function(it) {
            total += (it.price * it.qty);
            return '<div class="cart-item">' +
                '<img src="' + escHtml(it.image) + '" class="ci-thumb" alt="">' +
                '<div style="flex:1;min-width:0;"><div style="font-weight:900;font-size:0.78rem;">' + escHtml(it.name) + '</div><div style="font-size:0.7rem;color:#64748b;">' + fmtMoney(it.price) + ' x ' + it.qty + '</div></div>' +
                '<span style="font-weight:900;">' + fmtMoney(it.price * it.qty) + '</span>' +
            '</div>';
        }).join('');
        document.getElementById('sum-total').textContent = fmtMoney(total);
    }

    document.addEventListener('click', function(e) {
        var el = e.target.closest('[data-action]');
        if (!el) return;
        var act = el.getAttribute('data-action');

        if (act === 'nav') {
            switchView(el.getAttribute('data-view'));
        } else if (act === 'add-prod') {
            var p = products.find(function(x) { return x.id === Number(el.getAttribute('data-id')); });
            if (!p) return;
            var ex = cart.find(function(c) { return c.prodId === p.id; });
            if (ex) ex.qty += 1; else cart.push({ prodId: p.id, name: p.name, price: p.price, qty: 1, image: p.image });
            renderCart();
        } else if (act === 'clear-cart') {
            cart = [];
            renderCart();
        } else if (act === 'select-img-for-prod') {
            editingProductId = Number(el.getAttribute('data-id'));
            renderGalleryModalThumbs();
            openMod('modal-image-gallery');
        } else if (act === 'open-gallery-modal') {
            editingProductId = null; // Modo libre
            renderGalleryModalThumbs();
            openMod('modal-image-gallery');
        } else if (act === 'pick-gallery-img') {
            var chosenUrl = el.getAttribute('data-url');
            if (editingProductId) {
                var prod = products.find(function(x) { return x.id === editingProductId; });
                if (prod) {
                    prod.image = chosenUrl;
                    localStorage.setItem('ew_products_gallery_v1', JSON.stringify(products));
                    renderProductsTable();
                    renderCatalog();
                    toast('✓ Imagen asignada a ' + prod.name);
                }
            }
            closeMod('modal-image-gallery');
        } else if (act === 'close-modal') {
            closeMod(el.getAttribute('data-modal'));
        }
    });

    document.getElementById('inp-upload-gallery-file').addEventListener('change', function(e) {
        var file = e.target.files && e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
            var img = new Image();
            img.onload = function() {
                var canvas = document.createElement('canvas');
                canvas.width = 180;
                canvas.height = 180;
                var ctx = canvas.getContext('2d');
                var minS = Math.min(img.width, img.height);
                ctx.drawImage(img, (img.width - minS)/2, (img.height - minS)/2, minS, minS, 0, 0, 180, 180);
                var newBase64 = canvas.toDataURL('image/jpeg', 0.82);
                
                savedGallery.push(newBase64);
                localStorage.setItem('ew_image_gallery', JSON.stringify(savedGallery));
                renderGalleryModalThumbs();
                toast('✓ Foto subida y agregada a la galería');
            };
            img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
    });

    window.onload = function() {
        renderCatalog();
        renderCart();
    };
})();
</script>
</body>
</html>
